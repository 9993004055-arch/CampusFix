<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | CampusFix</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="topbar"><a class="brand" href="/">CampusFix</a><nav><a href="/">Home</a><a href="/register.html">Register</a></nav></header><main class="container"><div class="auth-wrap"><section class="form-card"><span class="eyebrow">SECURE SIGN IN</span><h1>Sign in to CampusFix</h1><p class="muted">Choose your role and enter your registered credentials.</p><div id="message"></div><form id="loginForm" class="stack-form"><label>Login as<select name="role" id="loginRole" required><option value="student">Student</option><option value="faculty">Faculty</option><option value="admin">Administrator</option><option value="repair_staff">Repairing Staff</option></select></label><label>Username or email<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary full">Sign in</button></form><p class="form-foot" id="registerFoot">Student/faculty account? <a href="/register.html">Create an account</a>.</p></section></div></main><script src="/assets/app.js"></script><script>const params=new URLSearchParams(location.search);const requested=params.get('role');if(['admin','repair_staff','student','faculty'].includes(requested))document.querySelector('#loginRole').value=requested;const role=document.querySelector('#loginRole');const foot=document.querySelector('#registerFoot');function updateFoot(){foot.hidden=!['student','faculty'].includes(role.value)}role.addEventListener('change',updateFoot);updateFoot();</script></body></html>
